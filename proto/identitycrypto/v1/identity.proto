syntax = "proto3";

// The shared identity schema of the concordium/structmux identity design
// (structmux docs/superpowers/specs/2026-10-11-daemon-mesh-schema-design.md,
// section 3.2): P-256 keys, principal ids, key delegations, signer chains,
// signed messages and documents, approvals and revocations, and the
// delivery attestation. Every signature covers a canonical transcript built
// by identity_crypto::transcripts, never these encoded bytes.
package identitycrypto.v1;

import "google/protobuf/timestamp.proto";

enum KeyScheme {
  KEY_SCHEME_UNSPECIFIED = 0;
  reserved 1, 2;
  reserved "KEY_SCHEME_ED25519", "KEY_SCHEME_SECP256K1_SCHNORR";
  KEY_SCHEME_ECDSA_P256 = 3;           // the scheme for every key
}

enum KeyPurpose {                      // numbering matches grorg's ROOT=1, DEVICE=2
  KEY_PURPOSE_UNSPECIFIED = 0;
  KEY_PURPOSE_ROOT = 1;
  KEY_PURPOSE_DEVICE = 2;
  KEY_PURPOSE_APPROVAL = 3;
  KEY_PURPOSE_ENCRYPTION = 4;          // marks an encryption half in records; delegated inside a DEVICE duo
}

message PublicKey {
  KeyScheme scheme = 1;
  bytes key = 2;                       // P-256: SEC1 uncompressed, 65 bytes
}

message DelegationCert {               // device → session
  reserved 1;                          // was: string agent_id
  reserved 2, 3;                       // were: fixed 32-byte device/session keys
  int64 not_before_unix_seconds = 4;
  int64 not_after_unix_seconds = 5;
  bytes signature = 6;                 // device key over session-delegation.v1
  PublicKey principal_genesis = 7;     // for an agent: its discarded genesis key
  uint32 mode = 8;                     // 0 self-rooted, 1 host-vouched
  PublicKey device = 9;
  PublicKey session = 10;
  optional PublicKey host_genesis = 11;  // mode 1: the vouching daemon
  optional string subject = 12;          // mode 1: the instance's global id
}

message PublicKeyDuo {                 // anonaccred's PublicKeyDuo: both halves, registered together
  PublicKey signing = 1;
  PublicKey encryption = 2;            // must differ from signing
}

message KeyDelegation {                // root → device duo, or root → approval key
  PublicKey principal_genesis = 1;
  PublicKey signing_root = 2;          // must equal the principal's current root
  KeyPurpose purpose = 3;              // DEVICE (with encryption half) or APPROVAL (without)
  PublicKey delegated = 4;             // the signing half / the approval key
  optional PublicKey delegated_encryption = 8;  // DEVICE: the duo's encryption half, covered by the same signature
  int64 issued_at_unix_seconds = 5;
  int64 not_after_unix_seconds = 6;    // never 0; i64::MAX = no expiry, only on delegations carried in a DeviceBinding
  bytes signature = 7;
}

message RootRotation {
  PublicKey principal_genesis = 1;
  PublicKey old_root = 2;
  PublicKey new_root = 3;
  int64 issued_at_unix_seconds = 4;
  bytes signature = 5;                 // old root over root-rotation.v1
}

message KeyRevocation {
  PublicKey principal_genesis = 1;
  PublicKey revoked = 2;
  PublicKey revoked_by = 3;            // any root in the principal's chain, or the revoked key itself
  int64 revoked_at_unix_seconds = 4;
  bytes signature = 5;
}

message SignerChain {
  oneof chain {
    SelfRooted self_rooted = 1;
    HostVouched host_vouched = 2;
  }
}
message SelfRooted {                   // humans, daemons
  KeyDelegation device = 1;            // root → device
  DelegationCert session = 2;          // device → session, mode 0
}
message HostVouched {                  // agent identities
  KeyDelegation host_device = 1;       // daemon root → daemon device
  DelegationCert session = 2;          // daemon device → agent session, mode 1
}

message SignedMessage {
  SignerChain signer = 1;
  string audience = 2;
  bytes nonce = 3;                     // 16 bytes
  int64 issued_at_unix_seconds = 4;
  optional bytes in_reply_to_nonce = 5;
  string body_type = 6;                // type URL
  bytes body = 7;                      // signed exactly as carried
  bytes signature = 8;                 // session key over signed-message.v1, 64-byte r‖s
  reserved 9;                          // future: signer_chain_sha256 (a cached-chain reference)
}

message SignedDocument {
  PublicKey signer_genesis = 1;        // the authority's genesis key
  PublicKey signing = 2;               // must be the signer's current root
  string document_type = 3;            // type URL
  uint64 version = 4;
  int64 issued_at_unix_seconds = 5;
  int64 expires_at_unix_seconds = 6;   // never 0; i64::MAX = never
  bytes body = 7;
  bytes signature = 8;
  repeated RootRotation signer_rotations = 9;   // the authority's chain from genesis
}

message Approval {                     // a human, present, decides one pending request
  PublicKey principal_genesis = 1;     // the approving human
  PublicKey approval_key = 2;
  PublicKey device = 3;                // the session's device key; must share a DeviceBinding with approval_key
  string audience = 4;                 // structmux:<target daemon short_id>
  string request_id = 5;
  bytes request_digest = 6;            // 32 bytes, schema section 5.2
  bool accept = 7;
  int64 issued_at_unix_seconds = 8;
  bytes signature = 9;                 // approval key over approval.v1
}

message PeerRevocation {               // the authority, present, freezes a principal or revokes one key
  PublicKey revoker_genesis = 1;       // the authority
  PublicKey approval_key = 2;
  PublicKey target_genesis = 3;
  optional PublicKey revoked = 4;      // absent = freeze the whole principal
  int64 issued_at_unix_seconds = 5;
  bytes signature = 6;
  bytes document_id = 7;               // 32 bytes: the id of the document in force (SHA-256 of its signed-document.v1 transcript)
}

// One message inside a signed delivery batch. body_text is authoritative.
message AttestedMessage {
  string message_id = 1;
  string room_id = 2;
  reserved 3;                               // was: string author_agent_id
  string body_text = 4;
  reserved 5;                               // was: VerificationOutcome verification_outcome
  reserved "verification_outcome";
  DelegationCert delegation_cert = 6;       // required: the agent's session delegation
  PublicKey author_genesis = 7;             // required: the author's genesis key
}

// Signed once per delivery batch by the delivering service's own key.
// recipient_devices is the target's set of DEVICE keys; a verifier checks
// that its own device key is a member.
message DeliveryAttestation {
  reserved 1;                               // was: repeated bytes recipient_device_public_keys
  string key_id = 2;
  uint64 batch_sequence = 3;
  google.protobuf.Timestamp attested_at = 4;  // required
  repeated AttestedMessage messages = 5;
  bytes signature = 6;
  repeated PublicKey recipient_devices = 7; // the target's DEVICE keys
}

enum PrincipalKind {
  PRINCIPAL_KIND_UNSPECIFIED = 0;
  PRINCIPAL_KIND_HUMAN = 1;
  PRINCIPAL_KIND_AGENT = 2;
  PRINCIPAL_KIND_DAEMON = 3;
}

// Who exists and what keys they hold. Carried in a SignedDocument body,
// signed by the authority. Every field added later may only grant: its
// absence must be the strict side (1b spec 2.2).
message PrincipalRegistry {
  repeated RegistryEntry entries = 1;
  bool allow_peer_revocation = 2;      // the authority may revoke with an approval key
  reserved 3;                          // future: groups of principals; grant-only (a group confers standing or is a grant target, never confines)
}

// A document body that carries a registry puts it at field 1, exactly once.
// identity-crypto decodes the verified body as RegistryCarrier; every other
// field belongs to the carrying product and is skipped.
message RegistryCarrier {
  PrincipalRegistry registry = 1;
}

message RegistryEntry {
  string principal_id = 1;             // canonical p256:<hex>
  PrincipalKind kind = 2;              // an unknown kind is skipped: it grants nothing
  optional string name = 3;            // non-empty; unique among non-frozen entries; never 16 hex chars
  bool frozen = 4;
  // Self-rooted (HUMAN, DAEMON; an AGENT is self-rooted or host-vouched, never both):
  PublicKeyDuo current_root = 5;       // delegations use its signing half
  repeated RootRotation rotations = 6; // genesis -> ... -> current_root.signing; empty for the authority
  repeated KeyRevocation revocations = 7;
  reserved 8;
  // HUMAN:
  repeated DeviceBinding devices = 9;
  // AGENT (host-vouched):
  repeated string allowed_hosts = 10;  // DAEMON principal ids, or "*"
  reserved 11;                         // future: steward, the HUMAN responsible for a DAEMON or AGENT; grant-only
}

message DeviceBinding {                // one human device
  KeyDelegation device = 1;            // the entry's root -> device duo
  optional KeyDelegation approval = 2; // the entry's root -> approval key (hardware)
  reserved 3;
  optional string host_daemon_id = 4;  // the DAEMON on this device; absent = hostless
}

// Every principal a receiver has ever accepted, so a removed and re-added
// entry is checked against the chain it had (1b spec 4.5). The receiver
// persists it; the authority is not in it.
message AcceptedChains {
  repeated AcceptedPrincipal principals = 1;
}

message AcceptedPrincipal {
  string principal_id = 1;
  PrincipalKind kind = 2;
  repeated RootRotation rotations = 3; // empty: the chain is the genesis key alone
}

// Keys a device held before a renewal under a new device duo, for the
// verifier's historical lookups. Public halves only, never a private key.
// Carried in the identity-keyfile agent directory (retired_devices.json).
message RetiredDevice {
  PublicKey signing = 1;
  PublicKey encryption = 2;
  int64 retired_at_unix_seconds = 3;   // a local claim, not signed by anyone
}

message DeviceHistory {
  repeated RetiredDevice retired = 1;
}

// The whole root chain of one principal, public data only: the agent
// directory's rotations.json.
message RootRotations {
  repeated RootRotation rotations = 1;
}
