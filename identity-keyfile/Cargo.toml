[package]
name = "identity-keyfile"
version = "0.11.0"
edition.workspace = true
rust-version.workspace = true
description = "Key directory for identity-crypto principals: load, save, renew and rotate keys, with a retired-device history"

[features]
# A temp agent-dir fixture for consumers' dev-dependencies. Off by default.
testkit = ["dep:tempfile"]

[dependencies]
identity-crypto.workspace = true
serde_json = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
libc = "0.2"
zeroize = "1"
tempfile = { version = "3", optional = true }
prost = "0.13"

[dev-dependencies]
tempfile = "3"
identity-crypto = { workspace = true, features = ["testkit"] }

# The testkit suite only exists with the feature; without it the target is skipped.
[[test]]
name = "testkit"
required-features = ["testkit"]

# The enrolment-index tool for scripts: `identity-enrol enrol --machine-dir D --key K --dir X`.
[[bin]]
name = "identity-enrol"
path = "src/bin/identity-enrol.rs"

[[test]]
name = "enrol_cli"
required-features = ["testkit"]

[[test]]
name = "keys_home_testkit"
required-features = ["testkit"]
