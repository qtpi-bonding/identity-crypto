[package]
name = "identity-keyfile"
version = "0.5.1"
edition = "2021"
rust-version = "1.89"
description = "Agent key directory for identity-crypto principals: load, save, renew and rotate keys, with a retired-device history"

[features]
# A temp agent-dir fixture for consumers' dev-dependencies. Off by default.
testkit = ["dep:tempfile"]

[dependencies]
identity-crypto = { path = "..", version = "0.5.1" }
serde_json = "1"
serde = "1"
thiserror = "2"
tempfile = { version = "3", optional = true }

[dev-dependencies]
tempfile = "3"

# The testkit suite only exists with the feature; without it the target is skipped.
[[test]]
name = "testkit"
required-features = ["testkit"]
