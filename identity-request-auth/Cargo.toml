[package]
name = "identity-request-auth"
version = "0.1.0"
edition = "2021"
description = "Per-request signing and verification over identity-crypto: a transport-free core, and a tonic layer behind the `tonic` feature"
readme = "README.md"

[features]
default = []
# The tonic/tower layer, built only from the core. Off by default.
tonic = ["dep:async-trait", "dep:tonic", "dep:tower", "dep:http", "dep:http-body", "dep:http-body-util", "dep:prost", "dep:bytes", "dep:tokio"]
# Test fixtures (fake clock, static device table) for consumers' dev-dependencies.
testkit = []

[dependencies]
identity-crypto = { path = "..", version = "0.10.0" }
async-trait = { version = "0.1", optional = true }
getrandom = "0.3"
thiserror = "2"
tonic = { version = "0.13.1", optional = true }
tower = { version = "0.5.3", optional = true, default-features = false, features = ["util"] }
http = { version = "1", optional = true }
http-body = { version = "1", optional = true }
http-body-util = { version = "0.1", optional = true }
# Only `time`: a server-streaming response that sits idle still ends when its session does.
tokio = { version = "1", optional = true, default-features = false, features = ["time"] }
prost = { version = "0.13", optional = true }
bytes = { version = "1", optional = true }

[dev-dependencies]
# identity-crypto's own fixtures (a signed registry and its Resolver), to test the core against the real full-chain verifier.
identity-crypto = { path = "..", version = "0.10.0", features = ["testkit"] }
tokio = { version = "1", features = ["macros", "rt", "test-util", "time"] }
