[package]
name = "identity-crypto"
version = "0.1.0"
edition = "2021"
description = "Canonical transcript encoding and ed25519 verification for the grorg/gait/multimatrix agent-identity design"

[dependencies]
anyhow = "1"
ed25519-dalek = "2"
hex = "0.4"
prost = "0.13"
pbjson = "0.7"
serde = { version = "1", features = ["derive"] }

[build-dependencies]
prost-build = "0.13"
pbjson-build = "0.7"
protoc-bin-vendored = "3"

[dev-dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
serde_json = "1"
