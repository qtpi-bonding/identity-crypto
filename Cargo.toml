[package]
name = "identity-crypto"
version = "0.11.0"
edition.workspace = true
rust-version.workspace = true
description = "P-256 key types, principal ids, canonical transcripts and the signature check for the concordium/structmux identity design"

[workspace]
members = [".", "identity-keyfile", "identity-request-auth"]

[workspace.package]
edition = "2021"
rust-version = "1.89"

[workspace.dependencies]
identity-crypto = { path = ".", version = "0.11.0" }
identity-keyfile = { path = "identity-keyfile", version = "0.11.0" }
coded-error = { git = "https://github.com/qtpi-bonding/coded-error.git", rev = "ffeaf3949230a8883b56c75e7031346a4f28ed4d", default-features = false }

[features]
# Test fixtures for consumers' dev-dependencies. Off by default.
testkit = []

[dependencies]
rust_jwk_duo = { git = "https://github.com/qtpi-bonding-org/rust_jwk_duo.git", rev = "489985d719539a6d8f841561728eb33cda82601e" }
sha2 = "0.11"
hex = "0.4"
thiserror = "2"
prost = "0.13"
pbjson = "0.7"
chrono = { version = "0.4", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }

[build-dependencies]
prost-build = "0.13"
pbjson-build = "0.7"
protoc-bin-vendored = "3"

[dev-dependencies]
serde_json = "1"
