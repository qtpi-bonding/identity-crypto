[package]
name = "identity-crypto"
version = "0.1.0"
edition = "2021"
description = "Canonical transcript encoding and ed25519 verification for the grorg/gait/multimatrix agent-identity design"

[dependencies]
anyhow = "1"
ed25519-dalek = "2"
hex = "0.4"

[dev-dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
